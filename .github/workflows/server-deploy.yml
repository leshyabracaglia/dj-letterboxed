name: server-deploy

# Gated on server-ci finishing successfully on main, rather than its own
# push trigger - so a broken build/test/vet never reaches prod. server-ci's
# own path filters (server/**, lib/api/**, ...) already scope which pushes
# it runs for, so this inherits that scoping for free.
on:
  workflow_run:
    workflows: ["server-ci"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: beatboxd-api
  INSTANCE_NAME_TAG: beatboxd-app

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.event.workflow_run.head_sha }}" \
                        -t "$REGISTRY/$ECR_REPOSITORY:latest" \
                        server
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.event.workflow_run.head_sha }}"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Look up the running app instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${INSTANCE_NAME_TAG}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ]; then
            echo "No running instance tagged Name=${INSTANCE_NAME_TAG} found" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Redeploy via SSM (refresh secrets, pull latest image, restart compose stack)
        id: ssm
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          # Ship refresh-env.sh inline (base64, to dodge SSM/JSON quoting) so
          # rotated Secrets Manager values land in .env on every deploy. The
          # ECR login is needed because the instance's docker login from
          # user_data expires after 12h. Migrations run from the freshly
          # pulled image before the restart, so new code never starts
          # against an old schema (set -e aborts the deploy if one fails).
          SCRIPT_B64=$(base64 -w0 server/deploy/refresh-env.sh)
          PARAMS=$(jq -n --arg b64 "$SCRIPT_B64" --arg region "$AWS_REGION" --arg registry "$REGISTRY" '{commands: [
            "set -e",
            "cd /opt/beatboxd",
            "echo \($b64) | base64 -d > refresh-env.sh",
            "AWS_REGION=\($region) bash refresh-env.sh",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
            "docker compose pull",
            "docker compose run --rm --no-deps --entrypoint /app/migrate api up",
            "docker compose up -d"
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the SSM command to finish
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ steps.instance.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command to finish" >&2
          exit 1

      - name: Verify the API is healthy post-deploy
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 https://api.beatboxd.com/healthz || echo 000)
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "api.beatboxd.com/healthz never returned 200 after deploy" >&2
          exit 1
