      - venues
  /api/venues/places-search:
    get:
      description: Pass the same client-generated sessionToken on every keystroke
        of one search and on the POST /api/logs that saves the picked place, so Google
        bills them as one session.
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      - description: Places autocomplete session token
        in: query
        name: sessionToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/PlaceSuggestion'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Search Google Places for venues not yet saved
      tags:
      - venues
  /api/venues/search:
    get:
      parameters:
      - description: name search; omit for the busiest venues
        in: query
        name: q
        type: string
      - description: max results, 1-50, default 20
