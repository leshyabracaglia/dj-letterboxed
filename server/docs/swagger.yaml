      security:
      - BearerAuth: []
      summary: Update the caller's own profile
      tags:
      - users
  /api/users/me/blocks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/User'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: List the users the caller has blocked, most recent first
      tags:
      - moderation
  /api/users/me/favorites:
    patch:
      consumes:
      - application/json
      parameters:
      - description: ordered review ids, at most 3, no duplicates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/setFavoritesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FavoriteReviewsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: 'Replace the caller''s showcased favorite nights out (0-3, ordered,
        #1 first) - they must be the caller''s own'
      tags:
      - users
  /api/users/me/push-tokens:
    delete:
      consumes:
      - application/json
      parameters:
      - description: the device's push token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pushTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Stop sending the caller's notifications to this device (on sign-out)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: the device's push token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pushTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Register this device's Expo push token for the caller (moves it from
        any other account)
      tags:
      - users
  /api/users/search:
    get:
      parameters:
      - description: name search; omit for the most-followed users
        in: query
        name: q
        type: string
      - description: max results, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/User'
            type: array
      summary: Search users by username or display name, most-followed first
      tags:
      - users
  /api/venues/{id}:
    get:
      parameters:
      - description: venue id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VenueDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Get a venue by id, with the events logged there and recent reviews
      tags:
      - venues
  /api/venues/places-search:
    get:
      description: Pass the same client-generated sessionToken on every keystroke
        of one search and on the POST /api/logs that saves the picked place, so Google
        bills them as one session.
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      - description: Places autocomplete session token
        in: query
        name: sessionToken
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/PlaceSuggestion'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Search Google Places for venues not yet saved
      tags:
      - venues
  /api/venues/search:
    get:
      parameters:
      - description: name search; omit for the busiest venues
        in: query
        name: q
        type: string
      - description: max results, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/VenueSummary'
            type: array
      summary: Search saved venues by name, busiest first
      tags:
      - venues
securityDefinitions:
  BearerAuth:
    description: Clerk-issued session JWT, e.g. "Bearer eyJhbGc..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
