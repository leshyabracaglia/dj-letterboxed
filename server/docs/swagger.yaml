basePath: /
definitions:
  AppVersionResponse:
    properties:
      iosUpdateUrl:
        type: string
      minIosBuild:
        type: integer
    required:
    - iosUpdateUrl
    - minIosBuild
    type: object
  CheckInResponse:
    properties:
      checkedInAt:
        description: |-
          When the caller checked in there (an earlier check-in the same night
          stands). Logging the venue for that night shows as verified.
        type: string
      venue:
        $ref: '#/definitions/NearbyVenue'
    required:
    - checkedInAt
    - venue
    type: object
  Dj:
    properties:
      bio:
        type: string
        x-nullable: true
      createdAt:
        type: string
      createdByUserId:
        type: string
        x-nullable: true
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      imageUrl:
        type: string
        x-nullable: true
      name:
        type: string
      slug:
        type: string
      spotifyId:
        type: string
        x-nullable: true
      updatedAt:
        type: string
    required:
    - bio
    - createdAt
    - createdByUserId
    - genres
    - id
    - imageUrl
    - name
    - slug
    - spotifyId
    - updatedAt
    type: object
  DjDetailResponse:
    properties:
      avgRating:
        type: number
        x-nullable: true
      dj:
        $ref: '#/definitions/Dj'
      ratingCounts:
        description: |-
          RatingCounts is how many ratings of them gave each star rating: index
          0 is 1 star, index 4 is 5 stars.
        items:
          type: integer
        type: array
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      reviewCount:
        type: integer
    required:
    - avgRating
    - dj
    - ratingCounts
    - recentReviews
    - reviewCount
    type: object
  Event:
    properties:
      createdAt:
        type: string
      createdByUserId:
        type: string
        x-nullable: true
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - createdAt
    - createdByUserId
    - id
    - name
    - slug
    type: object
  EventDetailResponse:
    properties:
      djs:
        items:
          $ref: '#/definitions/EventDj'
        type: array
      event:
        $ref: '#/definitions/EventSummary'
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      venues:
        items:
          $ref: '#/definitions/EventVenue'
        type: array
    required:
    - djs
    - event
    - recentReviews
    - venues
    type: object
  EventDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      reviewCount:
        type: integer
    required:
    - dj
    - reviewCount
    type: object
  EventSummary:
    properties:
      avgRating:
        type: number
        x-nullable: true
      createdAt:
        type: string
      createdByUserId:
        type: string
        x-nullable: true
      id:
        type: string
      name:
        type: string
      reviewCount:
        type: integer
      slug:
        type: string
    required:
    - avgRating
    - createdAt
    - createdByUserId
    - id
    - name
    - reviewCount
    - slug
    type: object
  EventVenue:
    properties:
      city:
        type: string
        x-nullable: true
      id:
        type: string
      name:
        type: string
      reviewCount:
        type: integer
    required:
    - city
    - id
    - name
    - reviewCount
    type: object
  FavoriteReviewsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  FeedResponse:
    properties:
      followingCount:
        type: integer
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
        x-nullable: true
    required:
    - followingCount
    - items
    - nextCursor
    type: object
  FollowingStatusResponse:
    properties:
      following:
        type: boolean
    required:
    - following
    type: object
  LineupEntry:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      rating:
        type: integer
        x-nullable: true
      reviewText:
        type: string
        x-nullable: true
    required:
    - dj
    - rating
    - reviewText
    type: object
  NearbyVenue:
    properties:
      city:
        type: string
        x-nullable: true
      distanceM:
        type: integer
      id:
        type: string
      name:
        type: string
    required:
    - city
    - distanceM
    - id
    - name
    type: object
  NearbyVenuesResponse:
    properties:
      venues:
        items:
          $ref: '#/definitions/NearbyVenue'
        type: array
    required:
    - venues
    type: object
  Notification:
    properties:
      actor:
        $ref: '#/definitions/User'
      commentBody:
        description: The comment's text, on comments.
        type: string
      createdAt:
        type: string
      id:
        type: string
      isUnread:
        type: boolean
      nightLogged:
        description: |-
          On tags: whether the recipient has logged the night themselves (see
          sameNightLoggedCond), so the app only prompts them to if not.
        type: boolean
      reviewId:
        description: |-
          The night out it's about (not on follows), and its title (see
          nightTitleSQL).
        type: string
      subject:
        type: string
      type:
        enum:
        - follow
        - like
        - comment
        - tag
        type: string
    required:
    - actor
    - commentBody
    - createdAt
    - id
    - isUnread
    - nightLogged
    - reviewId
    - subject
    - type
    type: object
  NotificationsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/Notification'
        type: array
      nextCursor:
        type: string
    required:
    - items
    - nextCursor
    type: object
  PaginatedReviews:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
        x-nullable: true
    required:
    - items
    - nextCursor
    type: object
  PlaceSuggestion:
    properties:
      name:
        type: string
      placeId:
        type: string
      secondaryText:
        description: |-
          SecondaryText is the rest of the place's description, usually its
          street address and city.
        type: string
    required:
    - name
    - placeId
    - secondaryText
    type: object
  PopularResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  RAArea:
    properties:
      country:
        type: string
      id:
        type: string
      name:
        type: string
    required:
    - country
    - id
    - name
    type: object
  RAArtist:
    properties:
      id:
        type: string
      name:
        type: string
    required:
    - id
    - name
    type: object
  RAArtistMatch:
    properties:
      dj:
        allOf:
        - $ref: '#/definitions/Dj'
        x-nullable: true
      name:
        type: string
      spotify:
        allOf:
        - $ref: '#/definitions/SpotifyArtist'
        x-nullable: true
    required:
    - dj
    - name
    - spotify
    type: object
  RAEvent:
    properties:
      artists:
        items:
          $ref: '#/definitions/RAArtist'
        type: array
      attending:
        type: integer
      date:
        description: Date is the night's calendar day, YYYY-MM-DD.
        type: string
      endTime:
        type: string
      flyerUrl:
        type: string
        x-nullable: true
      id:
        type: string
      startTime:
        description: |-
          StartTime/EndTime are local wall-clock times, RFC3339 without a zone
          (RA doesn't give one).
        type: string
      title:
        type: string
      url:
        type: string
      venue:
        $ref: '#/definitions/RAVenue'
    required:
    - artists
    - attending
    - date
    - endTime
    - flyerUrl
    - id
    - startTime
    - title
    - url
    - venue
    type: object
  RAEventMatchResponse:
    properties:
      event:
        $ref: '#/definitions/RAEvent'
      eventName:
        description: |-
          EventName is the party's name, or null when the night has none (an
          RA title that's just the lineup) and is headed by the venue.
        type: string
        x-nullable: true
      isDay:
        type: boolean
      isNight:
        type: boolean
      lineup:
        items:
          $ref: '#/definitions/RAArtistMatch'
        type: array
      seenAt:
        type: string
      venue:
        $ref: '#/definitions/RAVenueMatch'
    required:
    - event
    - eventName
    - isDay
    - isNight
    - lineup
    - seenAt
    - venue
    type: object
  RAEventsResponse:
    properties:
      area:
        allOf:
        - $ref: '#/definitions/RAArea'
        description: |-
          Area is the one listed: the one asked for, or the area of the
          caller's latest night out; null when neither is known.
        x-nullable: true
      events:
        items:
          $ref: '#/definitions/RAEvent'
        type: array
    required:
    - area
    - events
    type: object
  RAVenue:
    properties:
      address:
        type: string
      area:
        type: string
      id:
        type: string
      name:
        type: string
    required:
    - address
    - area
    - id
    - name
    type: object
  RAVenueMatch:
    properties:
      city:
        type: string
      name:
        type: string
      place:
        allOf:
        - $ref: '#/definitions/PlaceSuggestion'
        x-nullable: true
      placeSessionToken:
        type: string
      venue:
        allOf:
        - $ref: '#/definitions/VenueSummary'
        x-nullable: true
    required:
    - city
    - name
    - place
    - placeSessionToken
    - venue
    type: object
  RecentDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      lastSeenAt:
        type: string
    required:
    - dj
    - lastSeenAt
    type: object
  ReviewComment:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: string
      reviewId:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
    required:
    - body
    - createdAt
    - id
    - reviewId
    - userId
    type: object
  ReviewDTO:
    properties:
      city:
        type: string
        x-nullable: true
      commentCount:
        type: integer
      createdAt:
        type: string
      event:
        allOf:
        - $ref: '#/definitions/Event'
        x-nullable: true
      eventId:
        description: EventID is nil for a night with no event name (just a venue).
        type: string
        x-nullable: true
      id:
        type: string
      isDay:
        description: |-
          IsDay and IsNight say when this person went; both is day into night.
          At least one is set.
        type: boolean
      isLikedByMe:
        type: boolean
      isNight:
        type: boolean
      isPopular:
        type: boolean
      likeCount:
        type: integer
      lineup:
        items:
          $ref: '#/definitions/LineupEntry'
        type: array
      rating:
        description: |-
          Rating of the night as a whole, 1-5. Nil only on nights logged before
          nights were rated, which only rated their DJs.
        type: integer
        x-nullable: true
      reviewText:
        type: string
        x-nullable: true
      seenAt:
        type: string
      taggedUsers:
        items:
          $ref: '#/definitions/User'
        type: array
      tags:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
      venue:
        description: |-
          Venue is the venue's display name, denormalized alongside VenueID.
          Both are nil only on nights migrated from reviews that never had one.
        type: string
        x-nullable: true
      venueId:
        type: string
        x-nullable: true
      verified:
        description: |-
          Verified is whether this person checked in at the venue that night
          (see the check_ins table), worked out when the review is read.
        type: boolean
      viewerLoggedNight:
        description: |-
          On a review's own page, when the caller is tagged in it: whether
          they've logged the night themselves (the page prompts them to if not).
        type: boolean
    required:
    - city
    - commentCount
    - createdAt
    - event
    - eventId
    - id
    - isDay
    - isLikedByMe
    - isNight
    - likeCount
    - lineup
    - rating
    - reviewText
    - seenAt
    - taggedUsers
    - tags
    - updatedAt
    - userId
    - venue
    - venueId
    - verified
    type: object
  SpotifyArtist:
    properties:
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
        x-nullable: true
      name:
        type: string
      spotifyId:
        type: string
    required:
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  SuccessResponse:
    properties:
      success:
        type: boolean
    required:
    - success
    type: object
  TagSummary:
    properties:
      id:
        type: string
      isDefault:
        type: boolean
      name:
        type: string
      useCount:
        type: integer
    required:
    - id
    - isDefault
    - name
    - useCount
    type: object
  TopDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      timesSeen:
        type: integer
    required:
    - dj
    - timesSeen
    type: object
  TopVenue:
    properties:
      reviewCount:
        type: integer
      venue:
        type: string
    required:
    - reviewCount
    - venue
    type: object
  UnreadNotificationsResponse:
    properties:
      count:
        type: integer
    required:
    - count
    type: object
  UpdateReviewResponse:
    properties:
      taggedUsers:
        items:
          $ref: '#/definitions/User'
        type: array
    required:
    - taggedUsers
    type: object
  User:
    properties:
      avatarUrl:
        type: string
        x-nullable: true
      bio:
        type: string
        x-nullable: true
      createdAt:
        type: string
      displayName:
        type: string
        x-nullable: true
      id:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - createdAt
    - displayName
    - id
    - updatedAt
    - username
    type: object
  UserProfileResponse:
    properties:
      followerCount:
        type: integer
      followingCount:
        type: integer
      reviewCount:
        description: ReviewCount is how many nights out they've logged.
        type: integer
      user:
        $ref: '#/definitions/User'
    required:
    - followerCount
    - followingCount
    - reviewCount
    - user
    type: object
  UserStatsResponse:
    properties:
      recentDjs:
        items:
          $ref: '#/definitions/RecentDj'
        type: array
      topDjs:
        items:
          $ref: '#/definitions/TopDj'
        type: array
      topVenues:
        items:
          $ref: '#/definitions/TopVenue'
        type: array
      totalReviews:
        description: TotalReviews is how many nights out they've logged.
        type: integer
      uniqueDjs:
        type: integer
    required:
    - recentDjs
    - topDjs
    - topVenues
    - totalReviews
    - uniqueDjs
    type: object
  VenueDetailResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/VenueEvent'
        type: array
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      venue:
        $ref: '#/definitions/VenueSummary'
    required:
    - events
    - recentReviews
    - venue
    type: object
  VenueEvent:
    properties:
      event:
        $ref: '#/definitions/Event'
      reviewCount:
        type: integer
    required:
    - event
    - reviewCount
    type: object
  VenueSummary:
    properties:
      address:
        type: string
        x-nullable: true
      city:
        type: string
        x-nullable: true
      googlePlaceId:
        type: string
        x-nullable: true
      id:
        type: string
      name:
        type: string
      reviewCount:
        description: ReviewCount is how many nights out people have logged there.
        type: integer
    required:
    - address
    - city
    - googlePlaceId
    - id
    - name
    - reviewCount
    type: object
  addCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  apiError:
    properties:
      code:
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
  checkInRequest:
    properties:
      accuracyM:
        description: How accurate the device says the fix is, in meters.
        type: number
      latitude:
        type: number
      longitude:
        type: number
      venueId:
        type: string
    required:
    - accuracyM
    - latitude
    - longitude
    - venueId
    type: object
  createDjRequest:
    properties:
      bio:
        type: string
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      spotifyId:
        type: string
    required:
    - bio
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  createReportRequest:
    properties:
      commentId:
        type: string
      reason:
        description: spam, harassment, hate, sexual, violence or other.
        type: string
      reviewId:
        type: string
      userId:
        type: string
    required:
    - reason
    type: object
  createReviewRequest:
    properties:
      city:
        type: string
      eventId:
        type: string
      eventName:
        type: string
      isDay:
        description: 'When you went: day, night, or both. Neither given means night.'
        type: boolean
      isNight:
        type: boolean
      lineup:
        items:
          $ref: '#/definitions/lineupEntryInput'
        type: array
      placeId:
        type: string
      placeSessionToken:
        type: string
      rating:
        description: The night as a whole, 1-5. Required.
        type: integer
      reviewText:
        type: string
      seenAt:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: Descriptive tag names ("packed"), and friends who were there.
        items:
          type: string
        type: array
      venue:
        type: string
      venueId:
        type: string
    required:
    - city
    - eventId
    - eventName
    - isDay
    - isNight
    - lineup
    - placeId
    - placeSessionToken
    - rating
    - reviewText
    - seenAt
    - taggedUserIds
    - tags
    - venue
    - venueId
    type: object
  errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apiError'
    required:
    - error
    type: object
  lineupEntryInput:
    properties:
      djId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
    required:
    - djId
    - rating
    - reviewText
    type: object
  pushTokenRequest:
    properties:
      platform:
        description: '"ios" or "android"; ignored on unregister.'
        type: string
      token:
        description: An Expo push token (ExponentPushToken[...]).
        type: string
    required:
    - platform
    - token
    type: object
  setFavoritesRequest:
    properties:
      reviewIds:
        items:
          type: string
        type: array
    required:
    - reviewIds
    type: object
  updateProfileRequest:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      displayName:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - displayName
    - username
    type: object
  updateReviewRequest:
    properties:
      taggedUserIds:
        description: Replaces the tagged friends; [] clears them.
        items:
          type: string
        type: array
    required:
    - taggedUserIds
    type: object
info:
  contact: {}
  description: |-
    REST API for Beatboxd (Letterboxd for DJ sets). Generated from
    server/internal/httpapi handler annotations via swag - run
    `make openapi` in server/ to regenerate after changing a handler.
  title: Beatboxd API
  version: "1.0"
paths:
  /api/app-version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppVersionResponse'
      summary: Minimum supported native app build, for the client's force-update check
      tags:
      - app
  /api/check-ins:
    post:
      consumes:
      - application/json
      description: The venue must have coordinates, and latitude/longitude must be
        within 150m of it (up to 400m for a less accurate fix). Only the distance
        is stored, not the coordinates. A repeat check-in the same night is a no-op.
      parameters:
      - description: the venue and where the caller is
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/checkInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CheckInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Check in at a venue, so the caller's log of it tonight shows as verified
      tags:
      - check-ins
  /api/check-ins/nearby:
    get:
      description: Saved venues with coordinates within a few hundred meters of lat/lng.
        The coordinates aren't stored.
      parameters:
      - description: the caller's latitude
        in: query
        name: lat
        required: true
        type: number
      - description: the caller's longitude
        in: query
        name: lng
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/NearbyVenuesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Venues the caller is at, to check in at, nearest first
      tags:
      - check-ins
  /api/comments/{id}:
    delete:
      parameters:
      - description: comment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a comment owned by the caller (404, never 403, if not owned/found)
      tags:
      - reviews
  /api/djs:
    post:
      consumes:
      - application/json
      parameters:
      - description: DJ to create
        in: body
        name: body
        required: true
        schema:
