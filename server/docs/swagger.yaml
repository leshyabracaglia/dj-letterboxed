basePath: /
definitions:
  AppVersionResponse:
    properties:
      iosUpdateUrl:
        type: string
      minIosBuild:
        type: integer
    required:
    - iosUpdateUrl
    - minIosBuild
    type: object
  Dj:
    properties:
      bio:
        type: string
      createdAt:
        type: string
      createdByUserId:
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      imageUrl:
        type: string
      name:
        type: string
      slug:
        type: string
      spotifyId:
        type: string
      updatedAt:
        type: string
    required:
    - bio
    - createdAt
    - createdByUserId
    - genres
    - id
    - imageUrl
    - name
    - slug
    - spotifyId
    - updatedAt
    type: object
  DjDetailResponse:
    properties:
      avgRating:
        type: number
      dj:
        $ref: '#/definitions/Dj'
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      reviewCount:
        type: integer
    required:
    - avgRating
    - dj
    - recentReviews
    - reviewCount
    type: object
  Event:
    properties:
      city:
        type: string
      createdAt:
        type: string
      createdByUserId:
        type: string
      description:
        type: string
      eventDate:
        type: string
      id:
        type: string
      name:
        type: string
      seriesId:
        description: SeriesID is nil for a night that isn't part of a named event.
        type: string
      venue:
        description: |-
          Venue is the venue's display name, kept denormalized alongside
          VenueID so existing displays don't need a join.
        type: string
      venueId:
        type: string
    required:
    - city
    - createdAt
    - createdByUserId
    - description
    - eventDate
    - id
    - name
    - seriesId
    - venue
    - venueId
    type: object
  EventDetailResponse:
    properties:
      event:
        $ref: '#/definitions/Event'
      lineup:
        items:
          $ref: '#/definitions/Dj'
        type: array
      reviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      series:
        allOf:
        - $ref: '#/definitions/EventSeries'
        description: Series is nil for a night that isn't part of a named event.
    required:
    - event
    - lineup
    - reviews
    - series
    type: object
  EventSeries:
    properties:
      createdAt:
        type: string
      createdByUserId:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - createdAt
    - createdByUserId
    - id
    - name
    - slug
    type: object
  FavoriteReviewsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  FeedResponse:
    properties:
      followingCount:
        type: integer
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
    required:
    - followingCount
    - items
    - nextCursor
    type: object
  FollowingStatusResponse:
    properties:
      following:
        type: boolean
    required:
    - following
    type: object
  LeaderboardEntry:
    properties:
      reviewCount:
        type: integer
      user:
        $ref: '#/definitions/User'
    required:
    - reviewCount
    - user
    type: object
  NightLogResponse:
    properties:
      event:
        $ref: '#/definitions/Event'
      reviews:
        items:
          $ref: '#/definitions/Review'
        type: array
      series:
        $ref: '#/definitions/EventSeries'
    required:
    - event
    - reviews
    - series
    type: object
  PaginatedReviews:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
    required:
    - items
    - nextCursor
    type: object
  PlaceSuggestion:
    properties:
      name:
        type: string
      placeId:
        type: string
      secondaryText:
        description: |-
          SecondaryText is the rest of the place's description, usually its
          street address and city.
        type: string
    required:
    - name
    - placeId
    - secondaryText
    type: object
  PopularResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  Review:
    properties:
      createdAt:
        type: string
      djId:
        description: DjID is nil for a review of the night as a whole (EventID is
          then set).
        type: string
      eventId:
        type: string
      id:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    required:
    - createdAt
    - djId
    - eventId
    - id
    - rating
    - reviewText
    - seenAt
    - updatedAt
    - userId
    type: object
  ReviewComment:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: string
      reviewId:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
    required:
    - body
    - createdAt
    - id
    - reviewId
    - userId
    type: object
  ReviewDTO:
    properties:
      commentCount:
        type: integer
      createdAt:
        type: string
      dj:
        $ref: '#/definitions/Dj'
      djId:
        description: DjID is nil for a review of the night as a whole (EventID is
          then set).
        type: string
      event:
        $ref: '#/definitions/Event'
      eventId:
        type: string
      id:
        type: string
      isLikedByMe:
        type: boolean
      isPopular:
        type: boolean
      likeCount:
        type: integer
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        type: string
      taggedUsers:
        items:
          $ref: '#/definitions/User'
        type: array
      tags:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
    required:
    - createdAt
    - djId
    - eventId
    - id
    - rating
    - reviewText
    - seenAt
    - taggedUsers
    - tags
    - updatedAt
    - userId
    type: object
  SeriesDetailResponse:
    properties:
      djs:
        items:
          $ref: '#/definitions/SeriesDj'
        type: array
      nights:
        items:
          $ref: '#/definitions/SeriesNight'
        type: array
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      series:
        $ref: '#/definitions/SeriesSummary'
      venues:
        items:
          $ref: '#/definitions/SeriesVenue'
        type: array
    required:
    - djs
    - nights
    - recentReviews
    - series
    - venues
    type: object
  SeriesDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      nightCount:
        type: integer
    required:
    - dj
    - nightCount
    type: object
  SeriesNight:
    properties:
      avgRating:
        type: number
      event:
        $ref: '#/definitions/Event'
      reviewCount:
        type: integer
    required:
    - avgRating
    - event
    - reviewCount
    type: object
  SeriesSummary:
    properties:
      avgRating:
        type: number
      createdAt:
        type: string
      createdByUserId:
        type: string
      id:
        type: string
      name:
        type: string
      nightCount:
        type: integer
      reviewCount:
        type: integer
      slug:
        type: string
    required:
    - avgRating
    - createdAt
    - createdByUserId
    - id
    - name
    - nightCount
    - reviewCount
    - slug
    type: object
  SeriesVenue:
    properties:
      city:
        type: string
      id:
        type: string
      name:
        type: string
      nightCount:
        type: integer
    required:
    - city
    - id
    - name
    - nightCount
    type: object
  SpotifyArtist:
    properties:
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      spotifyId:
        type: string
    required:
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  SuccessResponse:
    properties:
      success:
        type: boolean
    required:
    - success
    type: object
  TagSummary:
    properties:
      id:
        type: string
      isDefault:
        type: boolean
      name:
        type: string
      useCount:
        type: integer
    required:
    - id
    - isDefault
    - name
    - useCount
    type: object
  TopDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      reviewCount:
        type: integer
    required:
    - dj
    - reviewCount
    type: object
  TopVenue:
    properties:
      reviewCount:
        type: integer
      venue:
        type: string
    required:
    - reviewCount
    - venue
    type: object
  User:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - createdAt
    - displayName
    - id
    - updatedAt
    - username
    type: object
  UserProfileResponse:
    properties:
      followerCount:
        type: integer
      followingCount:
        type: integer
      reviewCount:
        type: integer
      user:
        $ref: '#/definitions/User'
    required:
    - followerCount
    - followingCount
    - reviewCount
    - user
    type: object
  UserStatsResponse:
    properties:
      topDjs:
        items:
          $ref: '#/definitions/TopDj'
        type: array
      topVenues:
        items:
          $ref: '#/definitions/TopVenue'
        type: array
      totalReviews:
        type: integer
      uniqueDjs:
        type: integer
    required:
    - topDjs
    - topVenues
    - totalReviews
    - uniqueDjs
    type: object
  VenueDetailResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/Event'
        type: array
      venue:
        $ref: '#/definitions/VenueSummary'
    required:
    - events
    - venue
    type: object
  VenueSummary:
    properties:
      address:
        type: string
      city:
        type: string
      eventCount:
        type: integer
      googlePlaceId:
        type: string
      id:
        type: string
      name:
        type: string
    required:
    - address
    - city
    - eventCount
    - googlePlaceId
    - id
    - name
    type: object
  addCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  apiError:
    properties:
      code:
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
  createDjRequest:
    properties:
      bio:
        type: string
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      spotifyId:
        type: string
    required:
    - bio
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  createEventRequest:
    properties:
      city:
        type: string
      description:
        type: string
      eventDate:
        type: string
      name:
        type: string
      placeId:
        type: string
      placeSessionToken:
        type: string
      venue:
        type: string
      venueId:
        type: string
    required:
    - city
    - description
    - eventDate
    - name
    - placeId
    - placeSessionToken
    - venue
    - venueId
    type: object
  createNightLogRequest:
    properties:
      city:
        type: string
      djReviews:
        items:
          $ref: '#/definitions/djReviewInput'
        type: array
      lineupDjIds:
        description: |-
          DJs the user saw; added to the night's lineup. DJs in djReviews are
          added too, whether or not they're listed here.
        items:
          type: string
        type: array
      night:
        allOf:
        - $ref: '#/definitions/nightReviewInput'
        description: Review of the night as a whole. Required unless djReviews has
          one.
      placeId:
        type: string
      placeSessionToken:
        type: string
      seenAt:
        type: string
      seriesId:
        type: string
      seriesName:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: |-
          Tag names and tagged friends go on the night review, or on every DJ
          review when there's no night review.
        items:
          type: string
        type: array
      venue:
        type: string
      venueId:
        type: string
    required:
    - city
    - djReviews
    - lineupDjIds
    - night
    - placeId
    - placeSessionToken
    - seenAt
    - seriesId
    - seriesName
    - taggedUserIds
    - tags
    - venue
    - venueId
    type: object
  createReviewRequest:
    properties:
      djId:
        type: string
      eventId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: |-
          Tag names (new ones are added to the library). Omitted = leave
          as-is, [] = clear - same contract as TaggedUserIDs.
        items:
          type: string
        type: array
    required:
    - djId
    - eventId
    - rating
    - reviewText
    - seenAt
    - taggedUserIds
    - tags
    type: object
  djReviewInput:
    properties:
      djId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
    required:
    - djId
    - rating
    - reviewText
    type: object
  errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apiError'
    required:
    - error
    type: object
  nightReviewInput:
    properties:
      rating:
        type: integer
      reviewText:
        type: string
    required:
    - rating
    - reviewText
    type: object
  setFavoritesRequest:
    properties:
      reviewIds:
        items:
          type: string
        type: array
    required:
    - reviewIds
    type: object
  updateProfileRequest:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      displayName:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - displayName
    - username
    type: object
  updateReviewRequest:
    properties:
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: |-
          Tag names (new ones are added to the library). Omitted = leave
          as-is, [] = clear - same contract as TaggedUserIDs.
        items:
          type: string
        type: array
    required:
    - rating
    - reviewText
    - seenAt
    - taggedUserIds
    - tags
    type: object
info:
  contact: {}
  description: |-
    REST API for Beatboxd (Letterboxd for DJ sets). Generated from
    server/internal/httpapi handler annotations via swag - run
    `make openapi` in server/ to regenerate after changing a handler.
  title: Beatboxd API
  version: "1.0"
paths:
  /api/app-version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppVersionResponse'
      summary: Minimum supported native app build, for the client's force-update check
      tags:
      - app
  /api/comments/{id}:
    delete:
      parameters:
      - description: comment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a comment owned by the caller (404, never 403, if not owned/found)
      tags:
      - reviews
  /api/djs:
    post:
      consumes:
      - application/json
      parameters:
      - description: DJ to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDjRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dj'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a DJ (or return the existing one, deduped by spotifyId then
        slug)
      tags:
      - djs
  /api/djs/{id}/reviews:
    get:
      parameters:
      - description: DJ id
        in: path
        name: id
        required: true
        type: string
      - description: pagination cursor (RFC3339 seenAt of the last item)
        in: query
        name: cursor
        type: string
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedReviews'
      summary: List reviews for a DJ, cursor-paginated by seenAt desc
      tags:
      - djs
  /api/djs/{slug}:
    get:
      parameters:
      - description: DJ slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DjDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Get a DJ by slug, with rating aggregate and recent reviews
      tags:
      - djs
  /api/djs/search:
    get:
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dj'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Search DJs by name
      tags:
      - djs
  /api/djs/spotify-search:
    get:
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/SpotifyArtist'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Search Spotify for artists (fails open to [] on Spotify errors)
      tags:
      - djs
  /api/events:
    post:
      consumes:
      - application/json
      description: The venue is resolved from venueId, then placeId (a Google Places
        id, saved as a venue on first use), then the typed venue name.
      parameters:
      - description: event to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Event'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Create an event (or return the existing one, deduped by exact name+venue+date)
      tags:
      - events
  /api/events/{id}:
    get:
      parameters:
      - description: event id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/EventDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Get a night by id, with its series, lineup, and all its reviews
      tags:
      - events
  /api/events/search:
    get:
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Event'
            type: array
      summary: Search events by name
      tags:
      - events
  /api/feed:
    get:
      parameters:
      - description: pagination cursor (opaque, encodes createdAt + popular-pool offset)
        in: query
        name: cursor
        type: string
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FeedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: 'Activity feed: followed users'' reviews interleaved with popular ones
        every 4th item'
      tags:
      - feed
  /api/feed/popular:
    get:
      parameters:
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PopularResponse'
      summary: Most-liked-and-commented reviews, ranked
      tags:
      - feed
  /api/follows/{userId}:
    delete:
      parameters:
      - description: user id to unfollow
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Unfollow a user
      tags:
      - follows
    post:
      parameters:
      - description: user id to follow
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Follow a user
      tags:
      - follows
  /api/follows/is-following/{userId}:
    get:
      parameters:
      - description: user id
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FollowingStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
