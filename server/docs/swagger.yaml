basePath: /
definitions:
  AppVersionResponse:
    properties:
      iosUpdateUrl:
        type: string
      minIosBuild:
        type: integer
    required:
    - iosUpdateUrl
    - minIosBuild
    type: object
  Dj:
    properties:
      bio:
        type: string
      createdAt:
        type: string
      createdByUserId:
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        type: string
      imageUrl:
        type: string
      name:
        type: string
      slug:
        type: string
      spotifyId:
        type: string
      updatedAt:
        type: string
    required:
    - bio
    - createdAt
    - createdByUserId
    - genres
    - id
    - imageUrl
    - name
    - slug
    - spotifyId
    - updatedAt
    type: object
  DjDetailResponse:
    properties:
      avgRating:
        type: number
      dj:
        $ref: '#/definitions/Dj'
      ratingCounts:
        description: |-
          RatingCounts is how many reviews gave each star rating: index 0 is
          1 star, index 4 is 5 stars.
        items:
          type: integer
        type: array
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      reviewCount:
        type: integer
    required:
    - avgRating
    - dj
    - ratingCounts
    - recentReviews
    - reviewCount
    type: object
  Event:
    properties:
      createdAt:
        type: string
      createdByUserId:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    required:
    - createdAt
    - createdByUserId
    - id
    - name
    - slug
    type: object
  EventDetailResponse:
    properties:
      djs:
        items:
          $ref: '#/definitions/EventDj'
        type: array
      event:
        $ref: '#/definitions/EventSummary'
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      venues:
        items:
          $ref: '#/definitions/EventVenue'
        type: array
    required:
    - djs
    - event
    - recentReviews
    - venues
    type: object
  EventDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      logCount:
        type: integer
    required:
    - dj
    - logCount
    type: object
  EventSummary:
    properties:
      avgRating:
        type: number
      createdAt:
        type: string
      createdByUserId:
        type: string
      id:
        type: string
      logCount:
        type: integer
      name:
        type: string
      reviewCount:
        type: integer
      slug:
        type: string
    required:
    - avgRating
    - createdAt
    - createdByUserId
    - id
    - logCount
    - name
    - reviewCount
    - slug
    type: object
  EventVenue:
    properties:
      city:
        type: string
      id:
        type: string
      logCount:
        type: integer
      name:
        type: string
    required:
    - city
    - id
    - logCount
    - name
    type: object
  FavoriteReviewsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  FeedResponse:
    properties:
      followingCount:
        type: integer
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
    required:
    - followingCount
    - items
    - nextCursor
    type: object
  FollowingStatusResponse:
    properties:
      following:
        type: boolean
    required:
    - following
    type: object
  LeaderboardEntry:
    properties:
      reviewCount:
        type: integer
      user:
        $ref: '#/definitions/User'
    required:
    - reviewCount
    - user
    type: object
  Log:
    properties:
      city:
        type: string
      createdAt:
        type: string
      eventId:
        description: EventID is nil for a night with no event name (just a venue).
        type: string
      id:
        type: string
      isDay:
        description: |-
          IsDay and IsNight say when this person went; both is day into night.
          At least one is set.
        type: boolean
      isNight:
        type: boolean
      seenAt:
        type: string
      userId:
        type: string
      venue:
        description: |-
          Venue is the venue's display name, denormalized alongside VenueID.
          Both are nil only on logs migrated from reviews that had no night.
        type: string
      venueId:
        type: string
    required:
    - city
    - createdAt
    - eventId
    - id
    - isDay
    - isNight
    - seenAt
    - userId
    - venue
    - venueId
    type: object
  LogDTO:
    properties:
      city:
        type: string
      createdAt:
        type: string
      event:
        $ref: '#/definitions/Event'
      eventId:
        description: EventID is nil for a night with no event name (just a venue).
        type: string
      id:
        type: string
      isDay:
        description: |-
          IsDay and IsNight say when this person went; both is day into night.
          At least one is set.
        type: boolean
      isNight:
        type: boolean
      lineup:
        items:
          $ref: '#/definitions/Dj'
        type: array
      seenAt:
        type: string
      userId:
        type: string
      venue:
        description: |-
          Venue is the venue's display name, denormalized alongside VenueID.
          Both are nil only on logs migrated from reviews that had no night.
        type: string
      venueId:
        type: string
    required:
    - city
    - createdAt
    - event
    - eventId
    - id
    - isDay
    - isNight
    - lineup
    - seenAt
    - userId
    - venue
    - venueId
    type: object
  NightLogResponse:
    properties:
      event:
        allOf:
        - $ref: '#/definitions/Event'
        description: Event is nil for a night with no event name.
      log:
        $ref: '#/definitions/Log'
      reviews:
        items:
          $ref: '#/definitions/Review'
        type: array
    required:
    - event
    - log
    - reviews
    type: object
  PaginatedReviews:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      nextCursor:
        type: string
    required:
    - items
    - nextCursor
    type: object
  PlaceSuggestion:
    properties:
      name:
        type: string
      placeId:
        type: string
      secondaryText:
        description: |-
          SecondaryText is the rest of the place's description, usually its
          street address and city.
        type: string
    required:
    - name
    - placeId
    - secondaryText
    type: object
  PopularResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
    required:
    - items
    type: object
  Review:
    properties:
      createdAt:
        type: string
      djId:
        description: DjID is nil for a review of the night as a whole.
        type: string
      id:
        type: string
      logId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        description: SeenAt mirrors the log's, kept here for ordering and pagination.
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    required:
    - createdAt
    - djId
    - id
    - logId
    - rating
    - reviewText
    - seenAt
    - updatedAt
    - userId
    type: object
  ReviewComment:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: string
      reviewId:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
    required:
    - body
    - createdAt
    - id
    - reviewId
    - userId
    type: object
  ReviewDTO:
    properties:
      commentCount:
        type: integer
      createdAt:
        type: string
      dj:
        $ref: '#/definitions/Dj'
      djId:
        description: DjID is nil for a review of the night as a whole.
        type: string
      id:
        type: string
      isLikedByMe:
        type: boolean
      isPopular:
        type: boolean
      likeCount:
        type: integer
      log:
        allOf:
        - $ref: '#/definitions/LogDTO'
        description: |-
          Log is the night out this review is part of: event, venue, date,
          day/night and lineup.
      logId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
      seenAt:
        description: SeenAt mirrors the log's, kept here for ordering and pagination.
        type: string
      taggedUsers:
        items:
          $ref: '#/definitions/User'
        type: array
      tags:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userId:
        type: string
    required:
    - createdAt
    - djId
    - id
    - logId
    - rating
    - reviewText
    - seenAt
    - taggedUsers
    - tags
    - updatedAt
    - userId
    type: object
  SpotifyArtist:
    properties:
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      spotifyId:
        type: string
    required:
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  SuccessResponse:
    properties:
      success:
        type: boolean
    required:
    - success
    type: object
  TagSummary:
    properties:
      id:
        type: string
      isDefault:
        type: boolean
      name:
        type: string
      useCount:
        type: integer
    required:
    - id
    - isDefault
    - name
    - useCount
    type: object
  TopDj:
    properties:
      dj:
        $ref: '#/definitions/Dj'
      reviewCount:
        type: integer
    required:
    - dj
    - reviewCount
    type: object
  TopVenue:
    properties:
      reviewCount:
        type: integer
      venue:
        type: string
    required:
    - reviewCount
    - venue
    type: object
  User:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      createdAt:
        type: string
      displayName:
        type: string
      id:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - createdAt
    - displayName
    - id
    - updatedAt
    - username
    type: object
  UserProfileResponse:
    properties:
      followerCount:
        type: integer
      followingCount:
        type: integer
      reviewCount:
        type: integer
      user:
        $ref: '#/definitions/User'
    required:
    - followerCount
    - followingCount
    - reviewCount
    - user
    type: object
  UserStatsResponse:
    properties:
      topDjs:
        items:
          $ref: '#/definitions/TopDj'
        type: array
      topVenues:
        items:
          $ref: '#/definitions/TopVenue'
        type: array
      totalReviews:
        type: integer
      uniqueDjs:
        type: integer
    required:
    - topDjs
    - topVenues
    - totalReviews
    - uniqueDjs
    type: object
  VenueDetailResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/VenueEvent'
        type: array
      recentReviews:
        items:
          $ref: '#/definitions/ReviewDTO'
        type: array
      venue:
        $ref: '#/definitions/VenueSummary'
    required:
    - events
    - recentReviews
    - venue
    type: object
  VenueEvent:
    properties:
      event:
        $ref: '#/definitions/Event'
      logCount:
        type: integer
    required:
    - event
    - logCount
    type: object
  VenueSummary:
    properties:
      address:
        type: string
      city:
        type: string
      googlePlaceId:
        type: string
      id:
        type: string
      logCount:
        description: LogCount is how many nights out people have logged there.
        type: integer
      name:
        type: string
    required:
    - address
    - city
    - googlePlaceId
    - id
    - logCount
    - name
    type: object
  addCommentRequest:
    properties:
      body:
        type: string
    required:
    - body
    type: object
  apiError:
    properties:
      code:
        type: string
      message:
        type: string
    required:
    - code
    - message
    type: object
  createDjRequest:
    properties:
      bio:
        type: string
      genres:
        items:
          type: string
        type: array
      imageUrl:
        type: string
      name:
        type: string
      spotifyId:
        type: string
    required:
    - bio
    - genres
    - imageUrl
    - name
    - spotifyId
    type: object
  createNightLogRequest:
    properties:
      city:
        type: string
      djReviews:
        items:
          $ref: '#/definitions/djReviewInput'
        type: array
      eventId:
        type: string
      eventName:
        type: string
      isDay:
        description: 'When you went: day, night, or both. Neither given means night.'
        type: boolean
      isNight:
        type: boolean
      lineupDjIds:
        description: |-
          DJs you saw. DJs in djReviews are added too, whether or not they're
          listed here.
        items:
          type: string
        type: array
      night:
        allOf:
        - $ref: '#/definitions/nightReviewInput'
        description: Review of the night as a whole. Required unless djReviews has
          one.
      placeId:
        type: string
      placeSessionToken:
        type: string
      seenAt:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: |-
          Tag names and tagged friends go on the night review, or on every DJ
          review when there's no night review.
        items:
          type: string
        type: array
      venue:
        type: string
      venueId:
        type: string
    required:
    - city
    - djReviews
    - eventId
    - eventName
    - isDay
    - isNight
    - lineupDjIds
    - night
    - placeId
    - placeSessionToken
    - seenAt
    - taggedUserIds
    - tags
    - venue
    - venueId
    type: object
  djReviewInput:
    properties:
      djId:
        type: string
      rating:
        type: integer
      reviewText:
        type: string
    required:
    - djId
    - rating
    - reviewText
    type: object
  errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/apiError'
    required:
    - error
    type: object
  nightReviewInput:
    properties:
      rating:
        type: integer
      reviewText:
        type: string
    required:
    - rating
    - reviewText
    type: object
  pushTokenRequest:
    properties:
      platform:
        description: '"ios" or "android"; ignored on unregister.'
        type: string
      token:
        description: An Expo push token (ExponentPushToken[...]).
        type: string
    required:
    - platform
    - token
    type: object
  setFavoritesRequest:
    properties:
      reviewIds:
        items:
          type: string
        type: array
    required:
    - reviewIds
    type: object
  updateProfileRequest:
    properties:
      avatarUrl:
        type: string
      bio:
        type: string
      displayName:
        type: string
      username:
        type: string
    required:
    - avatarUrl
    - bio
    - displayName
    - username
    type: object
  updateReviewRequest:
    properties:
      rating:
        type: integer
      reviewText:
        type: string
      taggedUserIds:
        items:
          type: string
        type: array
      tags:
        description: |-
          Tag names (new ones are added to the library). Omitted = leave
          as-is, [] = clear - same contract as TaggedUserIDs.
        items:
          type: string
        type: array
    required:
    - rating
    - reviewText
    - taggedUserIds
    - tags
    type: object
info:
  contact: {}
  description: |-
    REST API for Beatboxd (Letterboxd for DJ sets). Generated from
    server/internal/httpapi handler annotations via swag - run
    `make openapi` in server/ to regenerate after changing a handler.
  title: Beatboxd API
  version: "1.0"
paths:
  /api/app-version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AppVersionResponse'
      summary: Minimum supported native app build, for the client's force-update check
      tags:
      - app
  /api/comments/{id}:
    delete:
      parameters:
      - description: comment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a comment owned by the caller (404, never 403, if not owned/found)
      tags:
      - reviews
  /api/djs:
    post:
      consumes:
      - application/json
      parameters:
      - description: DJ to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createDjRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Dj'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a DJ (or return the existing one, deduped by spotifyId then
        slug)
      tags:
      - djs
  /api/djs/{id}/reviews:
    get:
      parameters:
      - description: DJ id
        in: path
        name: id
        required: true
        type: string
      - description: pagination cursor (RFC3339 seenAt of the last item)
        in: query
        name: cursor
        type: string
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedReviews'
      summary: List reviews for a DJ, cursor-paginated by seenAt desc
      tags:
      - djs
  /api/djs/{slug}:
    get:
      parameters:
      - description: DJ slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DjDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Get a DJ by slug, with rating aggregate and recent reviews
      tags:
      - djs
  /api/djs/search:
    get:
      parameters:
      - description: name search; omit for the most-reviewed DJs
        in: query
        name: q
        type: string
      - description: max results, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Dj'
            type: array
      summary: Search DJs by name, most-reviewed first
      tags:
      - djs
  /api/djs/spotify-search:
    get:
      parameters:
      - description: search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/SpotifyArtist'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Search Spotify for artists (fails open to [] on Spotify errors)
      tags:
      - djs
  /api/events:
    get:
      parameters:
      - description: name search; omit to list all
        in: query
        name: q
        type: string
      - description: max results, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/EventSummary'
            type: array
      summary: List or search events (named parties like "Innervisions NY"), most-reviewed
        first
      tags:
      - events
  /api/events/{slug}:
    get:
      parameters:
      - description: event slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/EventDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errorEnvelope'
      summary: Get an event with its totals, the DJs and venues it's been logged with,
        and recent reviews
      tags:
      - events
  /api/feed:
    get:
      parameters:
      - description: pagination cursor (opaque, encodes createdAt + popular-pool offset)
        in: query
        name: cursor
        type: string
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FeedResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: 'Activity feed: followed users'' reviews interleaved with popular ones
        every 4th item'
      tags:
      - feed
  /api/feed/popular:
    get:
      parameters:
      - description: page size, 1-50, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PopularResponse'
      summary: Most-liked-and-commented reviews, ranked
      tags:
      - feed
  /api/follows/{userId}:
    delete:
      parameters:
      - description: user id to unfollow
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Unfollow a user
      tags:
      - follows
    post:
      parameters:
      - description: user id to follow
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Follow a user
      tags:
      - follows
  /api/follows/is-following/{userId}:
    get:
      parameters:
      - description: user id
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/FollowingStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errorEnvelope'
      security:
      - BearerAuth: []
      summary: Whether the caller follows the given user
      tags:
      - follows
  /api/leaderboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
