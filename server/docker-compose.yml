services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beatboxd
      POSTGRES_PASSWORD: beatboxd
      POSTGRES_DB: beatboxd
    ports:
      - "5433:5432"
    volumes:
      - beatboxd_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatboxd"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://beatboxd:beatboxd@postgres:5432/beatboxd?sslmode=disable
      PORT: "8080"
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}

volumes:
  beatboxd_pg_data:
